[package]
name = "singularity-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Evaluate autonomous digital-being cycles across Brama models through Singularity"
license = "MIT"
repository = "https://github.com/wisent-ai/singularity-benchmark"

[[bin]]
name = "singularity-benchmark"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The one way a Wisent program waits on a child process: it says on stderr
# what it waits for, where and since when, and how it ended.
stado-wait = { git = "https://github.com/wisent-ai/stado", rev = "692c0438d24117735c61373c0c178f1c1e21b080" }
